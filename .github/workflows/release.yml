name: Release

on:
  push:
    branches: [main]

permissions:
  # Version PR commits, and the git tags that mark staged versions.
  contents: write
  pull-requests: write
  # npm Trusted Publishing (OIDC). npm generates provenance on its own when it uses OIDC.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # "version" while changesets are pending, "publish" while a package version is not live on npm
      # (staged versions are not live until approved).
      - id: mode
        uses: changesets/action/select-mode@v2

      # Opens or updates the version PR. The sign-off keeps the bot's commit DCO-compliant.
      - if: steps.mode.outputs.mode == 'version'
        uses: changesets/action/version@v2
        with:
          script: pnpm version-packages
          pr-title: "chore: version @boletix packages"
          commit-message: |
            chore: version @boletix packages

            Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

      # Stages the new versions; each one goes live once a maintainer approves it with 2FA.
      # changesets/action/publish cannot stage, so scripts/stage-release.ts does it.
      - if: steps.mode.outputs.mode == 'publish'
        run: pnpm release
