name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Required for npm Trusted Publishing (OIDC) and provenance.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # With pending changesets: opens or updates the "Version Packages" PR.
      # With none left: publishes the packages that are not yet on npm.
      # Publishing uses OIDC; no NPM_TOKEN secret is needed once Trusted Publishing
      # is configured for each package (ranisalt/boletix, release.yml).
      #
      # The very first publish of each package must be done by hand with 2FA
      # (`pnpm changeset publish`), because Trusted Publishing can only be set up
      # on a package that already exists on npm.
      # v2 requires @changesets/cli v3 and authenticates with the default `github-token` input.
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore: version @boletix packages"
          pr-title: "chore: version @boletix packages"
