name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      # Generates src/lib/paraglide and the SvelteKit types that the app tests need.
      - run: pnpm check

      - run: pnpm lint:check
      - run: pnpm test

      - run: pnpm packages:check
      - run: pnpm packages:lint
      - run: pnpm packages:test
      - run: pnpm packages:build

      - name: Pack check (publint + attw)
        run: pnpm -r --filter "./packages/*" pack:check
